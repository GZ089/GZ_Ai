<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GZ_AI - Local RAG Assistant</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface-hover: #252540;
      --text: #e0e0e0;
      --text-muted: #a0a0b0;
      --accent: #7aa2f7;
      --accent-hover: #5d8af0;
      --error: #f28b82;
      --border: #2a2a3e;
      --radius: 12px;
      --sidebar-width: 280px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left var(--transition);
      flex-shrink: 0;
      overflow-y: auto;
      z-index: 10;
    }

    #sidebar.hidden {
      margin-left: calc(-1 * var(--sidebar-width));
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      color: var(--accent);
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #newChatBtn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    #newChatBtn:hover { background-color: var(--surface-hover); }

    #chatList {
      flex: 1;
      padding: 8px;
    }

    .chat-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item:hover { background-color: var(--surface-hover); }
    .chat-item.active { background-color: var(--accent-hover); color: white; }

    /* Main area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      background-color: var(--surface);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #toggleSidebarBtn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s;
    }

    #toggleSidebarBtn:hover { background-color: var(--surface-hover); }

    .brand {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 1px;
      flex: 1;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #f0c674;
      transition: background-color 0.3s;
    }

    .status-dot.online { background-color: #4caf50; }
    .status-dot.offline { background-color: #f28b82; }

    #chatContainer {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.6;
      word-wrap: break-word;
      animation: fadeInUp 0.3s ease;
      white-space: pre-wrap;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
      align-self: flex-end;
      background-color: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .assistant-message {
      align-self: flex-start;
      background-color: var(--surface);
      border-bottom-left-radius: 4px;
    }

    .assistant-message .sources {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .assistant-message .sources ul {
      list-style: none;
      padding-left: 0;
      margin: 5px 0 0;
    }

    .assistant-message .sources li { margin-bottom: 4px; }
    .assistant-message .sources a { color: var(--accent); text-decoration: none; }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      background-color: var(--surface);
      border-radius: var(--radius);
      align-self: flex-start;
      animation: fadeInUp 0.3s ease;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-muted);
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }

    .error-message {
      align-self: center;
      background-color: var(--error);
      color: #1e1e2e;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 0.9rem;
    }

    footer {
      background-color: var(--surface);
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #inputArea {
      display: flex;
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
    }

    #messageInput {
      flex: 1;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--text);
      font-size: 1rem;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    #messageInput:focus { border-color: var(--accent); }

    #sendBtn {
      background-color: var(--accent);
      border: none;
      border-radius: var(--radius);
      padding: 0 20px;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #sendBtn:hover { background-color: var(--accent-hover); }
    #sendBtn:disabled { background-color: var(--border); cursor: not-allowed; }

    @media (max-width: 600px) {
      #sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 100;
        box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      }
      .message { max-width: 95%; }
      header { padding: 10px 12px; }
      #chatContainer { padding: 12px; }
      footer { padding: 12px; }
      #inputArea { flex-direction: column; }
      #sendBtn { padding: 10px; }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <span>Chats</span>
      <button id="newChatBtn">New Chat</button>
    </div>
    <div id="chatList"></div>
  </div>

  <div id="main">
    <header>
      <button id="toggleSidebarBtn">☰</button>
      <div class="brand">GZ_AI</div>
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking status...</span>
      </div>
    </header>

    <div id="chatContainer"></div>

    <footer>
      <div id="inputArea">
        <textarea id="messageInput" rows="1" placeholder="Type your message... (Shift+Enter for newline)"></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </footer>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const sidebar = document.getElementById('sidebar');
    const chatList = document.getElementById('chatList');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    // Chat sessions management
    let chats = [];
    let currentChatId = null;
    const MAX_PROMPTS_PER_CHAT = 100; // hidden limit

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    function createChat() {
      const chat = {
        id: generateId(),
        messages: [], // { role: 'user'|'assistant', content: string, sources?: [] }
        promptCount: 0,
        createdAt: Date.now(),
      };
      chats.unshift(chat);
      currentChatId = chat.id;
      renderChatList();
      renderMessages();
      return chat;
    }

    function getCurrentChat() {
      return chats.find(c => c.id === currentChatId) || null;
    }

    function switchChat(chatId) {
      currentChatId = chatId;
      renderChatList();
      renderMessages();
    }

    function renderChatList() {
      chatList.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        const firstUserMsg = chat.messages.find(m => m.role === 'user');
        item.textContent = firstUserMsg ? firstUserMsg.content.substring(0, 30) : 'New Chat';
        item.addEventListener('click', () => switchChat(chat.id));
        chatList.appendChild(item);
      });
      if (chats.length === 0) {
        // No chats, create one
        createChat();
      }
    }

    function renderMessages() {
      chatContainer.innerHTML = '';
      const chat = getCurrentChat();
      if (!chat) return;
      chat.messages.forEach(msg => {
        if (msg.role === 'user') {
          addMessageToDOM('user', msg.content);
        } else {
          addMessageToDOM('assistant', msg.content, msg.sources);
        }
      });
      scrollToBottom();
    }

    function addMessageToDOM(role, content, sources = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}-message`;
      if (role === 'assistant' && sources && sources.length > 0) {
        let sourcesHtml = '<div class="sources"><strong>Sources:</strong><ul>';
        sources.forEach(src => {
          if (src.url) {
            sourcesHtml += `<li><a href="${src.url}" target="_blank" rel="noopener noreferrer">${src.name} (${src.type})</a></li>`;
          } else {
            sourcesHtml += `<li>${src.name} (${src.type})</li>`;
          }
        });
        sourcesHtml += '</ul></div>';
        msgDiv.innerHTML = `<div>${escapeHtml(content)}</div>${sourcesHtml}`;
      } else {
        msgDiv.textContent = content;
      }
      chatContainer.appendChild(msgDiv);
      scrollToBottom();
      return msgDiv;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'typing-indicator';
      typingDiv.id = 'typingIndicator';
      typingDiv.innerHTML = `<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>`;
      chatContainer.appendChild(typingDiv);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    function updateStatus() {
      fetch('/api/status')
        .then(res => res.json())
        .then(data => {
          if (data.modelLoaded) {
            statusDot.className = 'status-dot online';
            statusText.textContent = `Model online (${data.booksIndexed} chunks indexed)`;
          } else {
            statusDot.className = 'status-dot offline';
            statusText.textContent = 'Model not loaded';
          }
        })
        .catch(() => {
          statusDot.className = 'status-dot offline';
          statusText.textContent = 'Server offline';
        });
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      let chat = getCurrentChat();
      if (!chat) {
        chat = createChat();
      }

      // Hidden prompt limit: if reached, automatically start a new chat (without user notice)
      if (chat.promptCount >= MAX_PROMPTS_PER_CHAT) {
        chat = createChat();
      }

      // Add user message
      chat.messages.push({ role: 'user', content: message });
      chat.promptCount++;
      addMessageToDOM('user', message);
      messageInput.value = '';
      messageInput.style.height = 'auto';
      sendBtn.disabled = true;
      showTypingIndicator();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        removeTypingIndicator();

        if (!response.ok) {
          const errorMsg = data.message || 'An error occurred.';
          chat.messages.push({ role: 'assistant', content: errorMsg });
          addMessageToDOM('assistant', errorMsg, null, true);
        } else {
          const answer = data.answer;
          const sources = data.sources || [];
          chat.messages.push({ role: 'assistant', content: answer, sources });
          addMessageToDOM('assistant', answer, sources);
        }
      } catch (err) {
        removeTypingIndicator();
        const errorMsg = `Network error: ${err.message}`;
        chat.messages.push({ role: 'assistant', content: errorMsg });
        addMessageToDOM('assistant', errorMsg, null, true);
      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
        renderChatList(); // update chat list preview
      }
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
    });
    newChatBtn.addEventListener('click', () => {
      createChat();
      messageInput.focus();
      if (window.innerWidth <= 600) sidebar.classList.add('hidden');
    });
    toggleSidebarBtn.addEventListener('click', () => {
      sidebar.classList.toggle('hidden');
    });

    // Initialize
    createChat();
    updateStatus();
    setInterval(updateStatus, 10000);
    messageInput.focus();

    // On mobile, start with sidebar hidden
    if (window.innerWidth <= 600) {
      sidebar.classList.add('hidden');
    }
  </script>
</body>
</html>
